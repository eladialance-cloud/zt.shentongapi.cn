# MaxKB 反向代理（kb.zt.shentongapi.cn）
# 用法：放到 /etc/nginx/conf.d/kb.conf 后 nginx -t && systemctl reload nginx

# HTTP → HTTPS 重定向
server {
    listen 80;
    server_name kb.zt.shentongapi.cn;

    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name kb.zt.shentongapi.cn;

    # 证书（certbot 签发的子域名证书，路径以实际为准）
    ssl_certificate /etc/nginx/ssl/kb.zt.shentongapi.cn.crt;
    ssl_certificate_key /etc/nginx/ssl/kb.zt.shentongapi.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/maxkb.access.log;
    error_log /var/log/nginx/maxkb.error.log;

    client_max_body_size 100M;

    # 上传解析大文档需要较长超时
    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
