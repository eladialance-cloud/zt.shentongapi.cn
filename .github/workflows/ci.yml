name: CI

on:
  push:
    branches: [main, develop, upgrade/electron-41]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  migration-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - run: cd backend && npm run migration:gate
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - run: cd backend && npm ci
      - run: cd backend && npm run lint
      - run: cd backend && npm run build

  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - run: cd frontend/admin && npm ci
      - run: cd frontend/admin && npm run build
      - run: cd frontend/user && npm ci
      - run: cd frontend/user && npm run build
