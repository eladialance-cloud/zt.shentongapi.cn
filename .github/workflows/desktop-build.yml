# =============================================================================
# 深瞳AI 桌面端 - GitHub Actions 自动打包工作流
#
# 触发方式:
#   1. 推送 tag "desktop-v*" → 自动打包 Windows 安装包
#   2. 手动触发 (workflow_dispatch) → 可选平台和版本
#
# 产物:
#   - ShenTongAI-Setup-{version}-x64.exe (NSIS 安装包)
#   - ShenTongAI-Setup-{version}-x64.exe.zip (压缩包)
#   - latest.yml (electron-updater 清单)
#   - ShenTongAI-{version}-x64.exe.zip (用户下载文件)
#
# 部署:
#   打包完成后自动上传到服务器 /opt/shentong/updates/
#   并更新 CDN 软链接
# =============================================================================

name: Desktop Build

on:
  push:
    branches: [upgrade/electron-41]
    paths: ['desktop/**', '.github/workflows/desktop-build.yml']
    tags:
      - 'desktop-v*'
  pull_request:
    branches: [upgrade/electron-41]
    paths: ['desktop/**']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (如 0.5.2，留空则读取 package.json)'
        required: false
        type: string
      target:
        description: '目标平台'
        required: true
        type: choice
        default: 'win'
        options:
          - win
          - mac
          - all
      api_base:
        description: '生产环境 API 地址 (如 https://zt.shentongapi.cn/api)'
        required: false
        type: string
        default: 'https://zt.shentongapi.cn/api'
      deploy:
        description: '是否自动部署到服务器 (需配置 Secrets)'
        required: false
        type: choice
        default: 'false'
        options:
          - 'false'
          - 'true'

env:
  NODE_VERSION: '20'
  # 中国镜像加速
  ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
  ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Windows 打包
  # ---------------------------------------------------------------------------
  build-windows:
    name: 🪟 Build Windows Installer
    runs-on: windows-latest
    # GitHub Actions Windows runner: 4核 CPU, 16GB RAM, 14GB SSD
    # 比本地 i5-12400/16GB 更稳定，无其他进程争抢
    if: ${{ github.event.inputs.target != 'mac' || github.event.inputs.target == 'all' || startsWith(github.ref, 'refs/tags/desktop-v') }}
    defaults:
      run:
        working-directory: desktop

    steps:
      # ===== 1. Checkout =====
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ===== 1.5 Auto Bump Version =====
      # 方案B: 只修改本地package.json，不提交回仓库
      # 版本号在构建时自动+1，但commit不推送
      - name: 🔢 Auto Bump Version
        if: ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') }}
        run: |
          $pkg = Get-Content "package.json" -Raw | ConvertFrom-Json
          $parts = ($pkg.version -split '\.')
          $major = [int]$parts[0]
          $minor = [int]$parts[1]
          $patch = [int]$parts[2]
          # 版本进位规则：补丁位到 9 后进位（0.6.9 + 1 -> 0.7.0）
          if ($patch -ge 9) { $minor++; $patch = 0 } else { $patch++ }
          $newVer = "$major.$minor.$patch"
          $pkg.version = $newVer
          $pkg | ConvertTo-Json -Depth 10 | Set-Content "package.json" -Encoding UTF8
          Write-Host "🔢 Version bumped: $($pkg.version) -> $newVer"
          
          # 不提交回仓库，只在本次构建中使用新版本号
          # 如需持久化版本号，请手动修改package.json后push
        shell: pwsh

      # ===== 2. Setup Node.js =====
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      # ===== 3. Install Dependencies =====
      # 使用 --legacy-peer-deps 解决 vite@8 与 electron-vite@5 的 peer dependency 冲突
      # @journeyapps/sqlcipher@6.0.0 不支持 Windows (os: darwin,linux only)
      # 方案: 用 jq 移除 sqlcipher 依赖 -> npm install -> 复制类型声明文件
      # 注意: 禁用 postinstall 脚本，避免 tsx 尚未安装时执行 verify-electron.ts
      - name: Install Dependencies
        shell: bash
        run: |
          # 移除 sqlcipher 依赖（避免 Windows 上 node-gyp 编译失败）
          node -e "const p=require('./package.json'); delete p.dependencies['@journeyapps/sqlcipher']; require('fs').writeFileSync('package.json', JSON.stringify(p,null,2))"
          
          # 安装其他依赖（禁用 postinstall，避免 tsx 未就绪时执行）
          npm install --legacy-peer-deps --ignore-scripts
          
          # 修复 rolldown 原生绑定版本不匹配问题
          # 获取当前安装的 rolldown 版本，安装对应版本的 binding 包
          ROLLDOWN_VERSION=$(node -e "console.log(require('./node_modules/rolldown/package.json').version)")
          echo "rolldown version: $ROLLDOWN_VERSION"
          npm install @rolldown/binding-win32-x64-msvc@$ROLLDOWN_VERSION --legacy-peer-deps --ignore-scripts || true
          
          # 创建 sqlcipher 类型声明目录并复制
          mkdir -p node_modules/@journeyapps/sqlcipher/lib
          cp types/sqlcipher.d.ts node_modules/@journeyapps/sqlcipher/lib/sqlite3.d.ts
          
          # 创建最小 stub 入口文件，使 Electron 打包后 require('@journeyapps/sqlcipher') 不崩溃
          # 应用代码中使用 try/catch 包裹 require，返回 null 时自动进入降级模式
          printf '%s\n' '// Stub: @journeyapps/sqlcipher native module is not available in this build.' '// The application will fall back to cloud API when this module returns null.' 'module.exports = null' > node_modules/@journeyapps/sqlcipher/lib/sqlite3.js
          
          # 创建最小 package.json
          node -e "require('fs').writeFileSync('node_modules/@journeyapps/sqlcipher/package.json', JSON.stringify({name:'@journeyapps/sqlcipher',version:'6.0.0',main:'lib/sqlite3.js',types:'lib/sqlite3.d.ts'},null,2))"
          
          echo "Created sqlcipher stub module"
        env:
          ELECTRON_MIRROR: ${{ env.ELECTRON_MIRROR }}
          ELECTRON_BUILDER_BINARIES_MIRROR: ${{ env.ELECTRON_BUILDER_BINARIES_MIRROR }}

      # ===== 4. Download Electron Binary =====
      # Electron 的 postinstall 脚本在中国大陆网络下可能下载二进制失败
      # 使用 --repair 模式自动从镜像站下载修复
      - name: ✅ Download Electron Binary
        run: npx tsx scripts/verify-electron.ts --repair

      # ===== 5. Fix sqlcipher Native Module =====
      # @journeyapps/sqlcipher@6.0.0 不支持 Windows (os: darwin,linux only)
      # 安装步骤已保留类型声明，这里下载 Windows prebuilt binary
      - name: 🔧 Fix sqlcipher Native Module
        run: |
          $sqlcipherDir = "node_modules\@journeyapps\sqlcipher"
          $nodeFile = "$sqlcipherDir\build\Release\node_sqlite3.node"
          
          # 创建目录结构
          New-Item -ItemType Directory -Force -Path "$sqlcipherDir\build\Release" | Out-Null
          
          # 下载 Windows prebuilt binary (从 5.3.1 的 release)
          # N-API v6 binary 与 Electron 41 (N-API v9) ABI 兼容
          $url = "https://github.com/journeyapps/node-sqlcipher/releases/download/v5.3.1/sqlcipher-v5.3.1-electron-v116-win32-x64.tar.gz"
          $tempFile = "$env:TEMP\sqlcipher-win32.tar.gz"
          $extractDir = "$env:TEMP\sqlcipher-extract"
          
          Write-Host "📥 Downloading sqlcipher Windows binary..."
          try {
            Invoke-WebRequest -Uri $url -OutFile $tempFile -UseBasicParsing -TimeoutSec 60
            New-Item -ItemType Directory -Force -Path $extractDir | Out-Null
            tar -xzf $tempFile -C $extractDir 2>$null
            $extractedNode = Get-ChildItem $extractDir -Recurse -Filter "node_sqlite3.node" | Select-Object -First 1
            if ($extractedNode) {
              Copy-Item $extractedNode.FullName $nodeFile -Force
              Write-Host "✅ sqlcipher binary installed: $(((Get-Item $nodeFile).Length) / 1KB) KB"
            } else {
              Write-Host "⚠️ Extracted binary not found"
            }
          } catch {
            Write-Host "⚠️ Download failed: $($_.Exception.Message)"
          }
          
          # 如果下载失败，创建空占位文件（构建时跳过 sqlcipher 运行时功能）
          if (-not (Test-Path $nodeFile)) {
            Write-Host "⚠️ Using placeholder - sqlcipher features disabled in this build"
            [byte[]]$bytes = @(0x4D, 0x5A)  # MZ header (minimal PE)
            [System.IO.File]::WriteAllBytes($nodeFile, $bytes)
          }
        shell: pwsh

      # ===== 6. Download Runtime =====
      - name: 🔄 Download Runtime
        run: npx tsx scripts/fetch-runtime.ts --win
        continue-on-error: true
        # CDN 可能未就绪，失败不阻断（安装后首次启动会在线下载）

      # ===== 6.5 Download Hermes Python Runtime =====
      # 将 Python 3.11 嵌入版打包进安装包，避免用户机器没有 Python 时 Hermes 无法启动
      - name: 🐍 Download Hermes Python Runtime
        run: |
          $pythonDir = "runtime\hermes\python"
          $pythonVersion = "3.11.9"
          $pythonUrl = "https://www.python.org/ftp/python/$pythonVersion/python-$pythonVersion-embed-amd64.zip"
          $tempFile = "$env:TEMP\hermes-python.zip"

          if (Test-Path "$pythonDir\python.exe") {
            Write-Host "✅ Bundled Python already exists at $pythonDir"
            & "$pythonDir\python.exe" --version
            exit 0
          }

          Write-Host "📥 Downloading Python $pythonVersion embeddable..."
          New-Item -ItemType Directory -Force -Path $pythonDir | Out-Null
          Invoke-WebRequest -Uri $pythonUrl -OutFile $tempFile -UseBasicParsing -TimeoutSec 120

          Write-Host "📦 Extracting Python..."
          Expand-Archive -Path $tempFile -DestinationPath $pythonDir -Force
          Remove-Item $tempFile -ErrorAction SilentlyContinue

          # Enable site-packages by modifying python._pth BEFORE installing pip
          # The embeddable Python comments out "import site" by default, so pip module won't load
          # Note: _pth extension uses a leading dot in filename, so Get-ChildItem -Filter must match *._pth
          $pthFile = Get-ChildItem $pythonDir | Where-Object { $_.Name -like '*._pth' } | Select-Object -First 1
          if ($pthFile) {
            $content = [System.IO.File]::ReadAllText($pthFile.FullName)
            if ($content -match '#import site') {
              $content = $content -replace '#import site', 'import site'
              [System.IO.File]::WriteAllText($pthFile.FullName, $content)
              Write-Host "✅ Enabled site-packages in $($pthFile.Name)"
            } else {
              Write-Host "⚠️ import site already enabled or pattern not found"
            }
          } else {
            Write-Error "❌ python*._pth file not found in $pythonDir"
            exit 1
          }

          # Verify python works
          & "$pythonDir\python.exe" --version

          # Install pip
          Write-Host "📥 Installing pip..."
          Invoke-WebRequest -Uri "https://bootstrap.pypa.io/get-pip.py" -OutFile "$env:TEMP\get-pip.py" -UseBasicParsing -TimeoutSec 120
          & "$pythonDir\python.exe" "$env:TEMP\get-pip.py" --no-warn-script-location
          if ($LASTEXITCODE -ne 0) { Write-Error "get-pip.py failed"; exit 1 }
          Remove-Item "$env:TEMP\get-pip.py" -ErrorAction SilentlyContinue

          # Verify pip is available
          $pipCheck = & "$pythonDir\python.exe" -m pip --version 2>&1
          Write-Host "Pip: $pipCheck"
          if ($LASTEXITCODE -ne 0) { Write-Error "pip not available"; exit 1 }

          # Install hermes-agent
          $hermesVersion = "0.19.0"
          Write-Host "📥 Installing hermes-agent==$hermesVersion..."
          & "$pythonDir\python.exe" -m pip install "hermes-agent==$hermesVersion" --no-warn-script-location
          if ($LASTEXITCODE -ne 0) { Write-Error "hermes-agent install failed"; exit 1 }

          Write-Host "✅ Hermes Python runtime ready at $pythonDir"
        shell: pwsh
        continue-on-error: true

      # ===== 7. Inject API Base URL =====
      - name: ⚙️ Inject API Config
        if: ${{ github.event.inputs.api_base || true }}
        run: |
          $apiBase = '${{ github.event.inputs.api_base || 'https://zt.shentongapi.cn/api' }}'
          $envContent = "# Production environment config`nVITE_API_BASE_URL=$apiBase`n"
          Set-Content -Path ".env.production" -Value $envContent -Encoding UTF8
          Write-Host "✅ .env.production: VITE_API_BASE_URL=$apiBase"
        shell: pwsh

      # ===== 8. TypeCheck =====
      - name: 🔍 TypeCheck
        run: npm run typecheck

      # ===== 9. Build (electron-vite) =====
      - name: Build (electron-vite)
        run: npm run build
        env:
          # 禁用 PowerShell 的 $ErrorActionPreference='Stop'，避免警告被当作错误
          NODE_NO_WARNINGS: 1
        shell: bash

      # ===== 10. Verify getElectronPath NOT in bundle =====
      - name: 🛡️ Verify Bundle Integrity
        run: |
          $found = Select-String -Path "dist\main\index.js" -Pattern "getElectronPath" -Quiet
          if ($found) {
            Write-Error "❌ FATAL: getElectronPath found in dist/main/index.js - electron not externalized!"
            Write-Error "Fix: Add external: ['electron'] to electron.vite.config.ts rollupOptions"
            exit 1
          } else {
            Write-Host "✅ Bundle clean: no getElectronPath leak"
          }
        shell: pwsh

      # ===== 11. Package (electron-builder) =====
      - name: 📦 Package Installer (NSIS)
        run: npx electron-builder --win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GitHub Actions Windows: 16GB RAM 足够 NSIS 压缩
          # 本地 6GB 可用会被 SIGKILL，CI 无此问题

      # ===== 12. Normalize installer output directory =====
      # electron-builder.yml 配置 output: dist/installer-v${version}
      # 后续脚本和 workflow 步骤统一使用 dist/installer
      # 这里把 versioned 目录内容复制到 dist/installer
      - name: 📂 Normalize installer directory
        run: |
          $pkg = Get-Content "package.json" -Raw | ConvertFrom-Json
          $ver = if ('${{ github.event.inputs.version }}') { '${{ github.event.inputs.version }}' } else { $pkg.version }
          $versionedDir = "dist\installer-v$ver"
          $linkDir = "dist\installer"
          if (Test-Path $versionedDir) {
            New-Item -ItemType Directory -Force -Path $linkDir | Out-Null
            Copy-Item "$versionedDir\*" $linkDir -Recurse -Force
            Write-Host "✅ Copied $versionedDir -> $linkDir"
            Get-ChildItem $linkDir | ForEach-Object { Write-Host "  - $($_.Name)" }
          } elseif (Test-Path $linkDir) {
            Write-Host "✅ dist\installer already exists"
          } else {
            Write-Host "⚠️ Neither $versionedDir nor $linkDir exists"
            exit 1
          }
        shell: pwsh

      # ===== 12a. Verify packaged runtime manifest =====
      # 防回归：extraResources 打包失败会导致运行时下载全部失败（2026-08-06 事故根因）
      - name: ✅ Verify packaged runtime manifest
        shell: pwsh
        run: |
          $manifest = "dist\installer\win-unpacked\resources\runtime\manifest.json"
          if (-not (Test-Path $manifest)) {
            Write-Host "::error::缺少 resources/runtime/manifest.json - 运行时下载将全部失败"
            Get-ChildItem "dist\installer" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  - $($_.Name)" }
            exit 1
          }
          Write-Host "✅ packaged manifest: $manifest ($((Get-Item $manifest).Length) bytes)"

      # ===== 12b. Rename zip artifacts =====
      - name: 🏷️ Rename zip artifacts
        run: |
          $pkg = Get-Content "package.json" -Raw | ConvertFrom-Json
          $ver = if ('${{ github.event.inputs.version }}') { '${{ github.event.inputs.version }}' } else { $pkg.version }
          $installerDir = "dist\installer"
          if (Test-Path $installerDir) {
            Get-ChildItem $installerDir -Filter "*.zip" | Where-Object { $_.Name -notlike "*.exe.zip" } | ForEach-Object {
              $newName = $_.BaseName + ".exe.zip"
              Rename-Item $_.FullName $newName
              Write-Host "Renamed: $($_.Name) -> $newName"
            }
          }
        shell: pwsh

      # ===== 13. Generate latest.yml =====
      - name: 📄 Generate latest.yml
        run: npx tsx scripts/generate-latest-yml.ts

      # ===== 14. Verify Installer =====
      - name: ✅ Verify Installer
        run: npx tsx scripts/verify-installer.ts

      # ===== 15. Create user download file =====
      - name: 📋 Create Download File
        run: |
          $pkg = Get-Content "package.json" -Raw | ConvertFrom-Json
          $ver = if ('${{ github.event.inputs.version }}') { '${{ github.event.inputs.version }}' } else { $pkg.version }
          $installerDir = "dist\installer"
          if (Test-Path $installerDir) {
            # Auto-bump version 可能 +1，尝试匹配实际文件
            $exeZip = Get-ChildItem $installerDir -Filter "ShenTongAI-Setup-*-x64.exe.zip" | Select-Object -First 1
            if ($exeZip) {
              $actualVer = ($exeZip.BaseName -replace 'ShenTongAI-Setup-','' -replace '-x64','')
              $downloadName = "ShenTongAI-$actualVer-x64.exe.zip"
              Copy-Item $exeZip.FullName (Join-Path $installerDir $downloadName) -Force
              Write-Host "✅ Download file: $downloadName (from $($exeZip.Name))"
            } else {
              Write-Host "⚠️ No exe.zip found in $installerDir"
              Get-ChildItem $installerDir | ForEach-Object { Write-Host "  - $($_.Name)" }
            }
          }
        shell: pwsh

      # ===== 16. Upload Artifacts =====
      - name: 📤 Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-${{ github.event.inputs.version || 'latest' }}
          path: |
            desktop/dist/installer/*.exe
            desktop/dist/installer/*.exe.zip
            desktop/dist/installer/latest.yml
          retention-days: 30

      # ===== 17. Deploy to Server (optional) =====
      # 如需自动部署，请在 GitHub Settings > Secrets 配置：
      #   SERVER_HOST, SERVER_USER, SERVER_SSH_KEY
      # 注意：appleboy/scp-action 不支持 Windows runner，改用原生 scp/ssh
      - name: 🚀 Deploy to Server
        if: ${{ github.event.inputs.deploy == 'true' }}
        shell: bash
        timeout-minutes: 5
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -e
          # 写入 SSH 私钥
          mkdir -p ~/.ssh
          echo "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # SSH 连接选项：30秒超时，禁用严格主机检查
          SSH_OPTS="-i ~/.ssh/deploy_key -o ConnectTimeout=30 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"

          echo "📡 Testing SSH connection to $SERVER_HOST..."
          ssh $SSH_OPTS "$SERVER_USER@$SERVER_HOST" "echo 'SSH connection OK'" || {
            echo "❌ SSH connection failed! Check SERVER_HOST/USER/KEY secrets"
            exit 1
          }

          echo "📁 Ensuring remote directory exists..."
          ssh $SSH_OPTS "$SERVER_USER@$SERVER_HOST" \
            "mkdir -p /opt/shentong/updates"

          echo "💾 Backing up old version..."
          ssh $SSH_OPTS "$SERVER_USER@$SERVER_HOST" \
            "cd /opt/shentong/updates && [ -f latest.yml ] && cp latest.yml latest.yml.bak.$(date +%Y%m%d%H%M%S) || true"

          echo "📤 Uploading installer files..."
          scp $SSH_OPTS \
            dist/installer/*.exe \
            dist/installer/*.exe.zip \
            dist/installer/latest.yml \
            "$SERVER_USER@$SERVER_HOST:/opt/shentong/updates/"

          echo "📋 Deployed files:"
          ssh $SSH_OPTS "$SERVER_USER@$SERVER_HOST" \
            "cd /opt/shentong/updates && ls -lh"

          echo "🧹 Cleaning up..."
          rm -f ~/.ssh/deploy_key

  # ---------------------------------------------------------------------------
  # Job 2: macOS 打包 (可选，需 Mac runner)
  # ---------------------------------------------------------------------------
  build-macos:
    name: 🍎 Build macOS Installer
    runs-on: macos-latest
    if: ${{ github.event.inputs.target == 'mac' || github.event.inputs.target == 'all' }}
    defaults:
      run:
        working-directory: desktop

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: 📚 Install Dependencies
        run: npm ci
        env:
          ELECTRON_MIRROR: ${{ env.ELECTRON_MIRROR }}

      - name: 🔄 Download Runtime
        run: npx tsx scripts/fetch-runtime.ts --mac
        continue-on-error: true

      - name: ⚙️ Inject API Config
        run: |
          api_base="${{ github.event.inputs.api_base || 'https://zt.shentongapi.cn/api' }}"
          echo "# Production environment config" > .env.production
          echo "VITE_API_BASE_URL=$api_base" >> .env.production

      - name: 🔍 TypeCheck
        run: npm run typecheck

      - name: 🔨 Build
        run: npm run build

      - name: 📦 Package
        run: npx electron-builder --mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📤 Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-${{ github.event.inputs.version || 'latest' }}
          path: |
            desktop/dist/installer/*.dmg
            desktop/dist/installer/latest.yml
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Job 3: Release (打 tag 时创建 GitHub Release)
  # ---------------------------------------------------------------------------
  release:
    name: 📢 Create Release
    runs-on: ubuntu-latest
    needs: [build-windows]
    if: startsWith(github.ref, 'refs/tags/desktop-v')

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📥 Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: desktop-windows-${{ github.event.inputs.version || 'latest' }}
          path: artifacts/

      - name: 📢 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 深瞳AI Desktop ${{ github.ref_name }}
          body: |
            ## 深瞳AI 桌面端 ${{ github.ref_name }}

            ### 安装包
            - **Windows x64**: 下载 `ShenTongAI-Setup-*-x64.exe`
            - **压缩包**: 下载 `ShenTongAI-Setup-*-x64.exe.zip`

            ### 自动更新
            已安装的用户可通过 electron-updater 自动升级到此版本。

            ### 校验
            SHA-512 哈希请查看 `latest.yml`。
          files: artifacts/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
