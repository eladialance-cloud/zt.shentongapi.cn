# =============================================================================
# 深瞳AI 桌面端 - GitHub Actions 自动打包工作流
#
# 触发方式:
#   1. 推送 tag "desktop-v*" → 自动打包 Windows 安装包
#   2. 手动触发 (workflow_dispatch) → 可选平台和版本
#
# 产物:
#   - ShenTongAI-Setup-{version}-x64.exe (NSIS 安装包)
#   - ShenTongAI-Setup-{version}-x64.exe.zip (压缩包)
#   - latest.yml (electron-updater 清单)
#   - ShenTongAI-{version}-x64.exe.zip (用户下载文件)
#
# 部署:
#   打包完成后自动上传到服务器 /opt/shentong/updates/
#   并更新 CDN 软链接
# =============================================================================

name: Desktop Build

on:
  push:
    branches: [upgrade/electron-41]
    paths: ['desktop/**', '.github/workflows/desktop-build.yml']
    tags:
      - 'desktop-v*'
  pull_request:
    branches: [upgrade/electron-41]
    paths: ['desktop/**']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (如 0.5.2，留空则读取 package.json)'
        required: false
        type: string
      target:
        description: '目标平台'
        required: true
        type: choice
        default: 'win'
        options:
          - win
          - mac
          - all
      api_base:
        description: '生产环境 API 地址 (如 https://zt.shentongapi.cn/api)'
        required: false
        type: string
        default: 'https://zt.shentongapi.cn/api'
      deploy:
        description: '是否自动部署到服务器 (需配置 Secrets)'
        required: false
        type: choice
        default: 'false'
        options:
          - 'false'
          - 'true'

env:
  NODE_VERSION: '20'
  # 中国镜像加速
  ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
  ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Windows 打包
  # ---------------------------------------------------------------------------
  build-windows:
    name: 🪟 Build Windows Installer
    runs-on: windows-latest
    # GitHub Actions Windows runner: 4核 CPU, 16GB RAM, 14GB SSD
    # 比本地 i5-12400/16GB 更稳定，无其他进程争抢
    if: ${{ github.event.inputs.target != 'mac' || github.event.inputs.target == 'all' || startsWith(github.ref, 'refs/tags/desktop-v') }}
    defaults:
      run:
        working-directory: desktop

    steps:
      # ===== 1. Checkout =====
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ===== 1.5 Auto Bump Version =====
      - name: 🔢 Auto Bump Version
        if: ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') }}
        run: |
          $pkg = Get-Content "package.json" -Raw | ConvertFrom-Json
          $ver = [Version]$pkg.version
          $newVer = "$($ver.Major).$($ver.Minor).$($ver.Build + 1)"
          $pkg.version = $newVer
          $pkg | ConvertTo-Json -Depth 10 | Set-Content "package.json" -Encoding UTF8
          Write-Host "🔢 Version bumped: $($ver) -> $newVer"
          
          # Git commit the version bump
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: bump version to $newVer [ci skip]"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:${{ github.ref_name }}
        shell: pwsh

      # ===== 2. Setup Node.js =====
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      # ===== 3. Install Dependencies =====
      - name: 📚 Install Dependencies
        run: npm ci
        env:
          # 镜像加速 Electron 二进制下载
          ELECTRON_MIRROR: ${{ env.ELECTRON_MIRROR }}
          ELECTRON_BUILDER_BINARIES_MIRROR: ${{ env.ELECTRON_BUILDER_BINARIES_MIRROR }}

      # ===== 4. Verify Electron Installation =====
      - name: ✅ Verify Electron
        run: npx tsx scripts/verify-electron.ts --check

      # ===== 5. Fix sqlcipher Native Module =====
      # @journeyapps/sqlcipher 6.0.0 无 Windows prebuilt binary
      # 复用 5.3.1 时代的 N-API v6 binary (ABI 稳定，与 Electron 41 N-API v9 兼容)
      - name: 🔧 Fix sqlcipher Native Module
        run: |
          $nodeFile = "node_modules\@journeyapps\sqlcipher\build\Release\node_sqlite3.node"
          if (-not (Test-Path $nodeFile)) {
            Write-Host "⚠️ sqlcipher .node not found, installing from source..."
            # 尝试从 5.3.1 获取 prebuilt binary
            npm install @journeyapps/sqlcipher@5.3.1 --save-exact
            npm install @journeyapps/sqlcipher@6.0.0 --save-exact
          }
          if (Test-Path $nodeFile) {
            Write-Host "✅ sqlcipher .node exists: $(((Get-Item $nodeFile).Length) / 1KB) KB"
          } else {
            Write-Host "⚠️ sqlcipher .node still missing - build may fail"
          }
        shell: pwsh

      # ===== 6. Download Runtime =====
      - name: 🔄 Download Runtime
        run: npx tsx scripts/fetch-runtime.ts --win
        continue-on-error: true
        # CDN 可能未就绪，失败不阻断（安装后首次启动会在线下载）

      # ===== 7. Inject API Base URL =====
      - name: ⚙️ Inject API Config
        if: ${{ github.event.inputs.api_base || true }}
        run: |
          $apiBase = '${{ github.event.inputs.api_base || 'https://zt.shentongapi.cn/api' }}'
          $envContent = "# Production environment config`nVITE_API_BASE_URL=$apiBase`n"
          Set-Content -Path ".env.production" -Value $envContent -Encoding UTF8
          Write-Host "✅ .env.production: VITE_API_BASE_URL=$apiBase"
        shell: pwsh

      # ===== 8. TypeCheck =====
      - name: 🔍 TypeCheck
        run: npm run typecheck

      # ===== 9. Build (electron-vite) =====
      - name: 🔨 Build (electron-vite)
        run: npm run build

      # ===== 10. Verify getElectronPath NOT in bundle =====
      - name: 🛡️ Verify Bundle Integrity
        run: |
          $found = Select-String -Path "dist\main\index.js" -Pattern "getElectronPath" -Quiet
          if ($found) {
            Write-Error "❌ FATAL: getElectronPath found in dist/main/index.js - electron not externalized!"
            Write-Error "Fix: Add external: ['electron'] to electron.vite.config.ts rollupOptions"
            exit 1
          } else {
            Write-Host "✅ Bundle clean: no getElectronPath leak"
          }
        shell: pwsh

      # ===== 11. Package (electron-builder) =====
      - name: 📦 Package Installer (NSIS)
        run: npx electron-builder --win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GitHub Actions Windows: 16GB RAM 足够 NSIS 压缩
          # 本地 6GB 可用会被 SIGKILL，CI 无此问题

      # ===== 12. Rename zip artifacts =====
      - name: 🏷️ Rename zip artifacts
        run: |
          $pkg = Get-Content "package.json" -Raw | ConvertFrom-Json
          $ver = if ('${{ github.event.inputs.version }}') { '${{ github.event.inputs.version }}' } else { $pkg.version }
          $installerDir = "dist\installer-v$ver"
          $linkDir = "dist\installer"
          $targetDir = if (Test-Path $linkDir) { $linkDir } else { $installerDir }
          if (Test-Path $targetDir) {
            Get-ChildItem $targetDir -Filter "*.zip" | Where-Object { $_.Name -notlike "*.exe.zip" } | ForEach-Object {
              $newName = $_.BaseName + ".exe.zip"
              Rename-Item $_.FullName $newName
              Write-Host "Renamed: $($_.Name) -> $newName"
            }
          }
        shell: pwsh

      # ===== 13. Generate latest.yml =====
      - name: 📄 Generate latest.yml
        run: npx tsx scripts/generate-latest-yml.ts

      # ===== 14. Verify Installer =====
      - name: ✅ Verify Installer
        run: npx tsx scripts/verify-installer.ts

      # ===== 15. Create user download file =====
      - name: 📋 Create Download File
        run: |
          $pkg = Get-Content "package.json" -Raw | ConvertFrom-Json
          $ver = if ('${{ github.event.inputs.version }}') { '${{ github.event.inputs.version }}' } else { $pkg.version }
          $installerDir = "dist\installer"
          if (Test-Path $installerDir) {
            $exeZip = Get-ChildItem $installerDir -Filter "ShenTongAI-Setup-$ver-x64.exe.zip" | Select-Object -First 1
            if ($exeZip) {
              $downloadName = "ShenTongAI-$ver-x64.exe.zip"
              Copy-Item $exeZip.FullName (Join-Path $installerDir $downloadName) -Force
              Write-Host "✅ Download file: $downloadName"
            }
          }
        shell: pwsh

      # ===== 16. Upload Artifacts =====
      - name: 📤 Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-${{ github.event.inputs.version || 'latest' }}
          path: |
            desktop/dist/installer/*.exe
            desktop/dist/installer/*.exe.zip
            desktop/dist/installer/latest.yml
          retention-days: 30

      # ===== 17. Deploy to Server (optional) =====
      # ===== 17. Deploy to Server (optional) =====
      # 如需自动部署，请在 GitHub Settings > Secrets 配置：
      #   SERVER_HOST, SERVER_USER, SERVER_SSH_KEY
      - name: 🚀 Deploy to Server
        if: ${{ github.event.inputs.deploy == 'true' }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: desktop/dist/installer/*
          target: /opt/shentong/updates/
          # 先备份再覆盖
          script: |
            cd /opt/shentong/updates
            # 备份旧版本
            if [ -f latest.yml ]; then
              cp latest.yml "latest.yml.bak.$(date +%Y%m%d%H%M%S)"
            fi
            # 更新文件
            mv -f /tmp/github_action/desktop/dist/installer/* .
            # 重启后端服务（如果需要更新下载链接）
            # systemctl restart shentong-backend
            echo "✅ Deployed to /opt/shentong/updates/"
            ls -lh

  # ---------------------------------------------------------------------------
  # Job 2: macOS 打包 (可选，需 Mac runner)
  # ---------------------------------------------------------------------------
  build-macos:
    name: 🍎 Build macOS Installer
    runs-on: macos-latest
    if: ${{ github.event.inputs.target == 'mac' || github.event.inputs.target == 'all' }}
    defaults:
      run:
        working-directory: desktop

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: 📚 Install Dependencies
        run: npm ci
        env:
          ELECTRON_MIRROR: ${{ env.ELECTRON_MIRROR }}

      - name: 🔄 Download Runtime
        run: npx tsx scripts/fetch-runtime.ts --mac
        continue-on-error: true

      - name: ⚙️ Inject API Config
        run: |
          api_base="${{ github.event.inputs.api_base || 'https://zt.shentongapi.cn/api' }}"
          echo "# Production environment config" > .env.production
          echo "VITE_API_BASE_URL=$api_base" >> .env.production

      - name: 🔍 TypeCheck
        run: npm run typecheck

      - name: 🔨 Build
        run: npm run build

      - name: 📦 Package
        run: npx electron-builder --mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📤 Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-${{ github.event.inputs.version || 'latest' }}
          path: |
            desktop/dist/installer/*.dmg
            desktop/dist/installer/latest.yml
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Job 3: Release (打 tag 时创建 GitHub Release)
  # ---------------------------------------------------------------------------
  release:
    name: 📢 Create Release
    runs-on: ubuntu-latest
    needs: [build-windows]
    if: startsWith(github.ref, 'refs/tags/desktop-v')

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📥 Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: desktop-windows-${{ github.event.inputs.version || 'latest' }}
          path: artifacts/

      - name: 📢 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 深瞳AI Desktop ${{ github.ref_name }}
          body: |
            ## 深瞳AI 桌面端 ${{ github.ref_name }}

            ### 安装包
            - **Windows x64**: 下载 `ShenTongAI-Setup-*-x64.exe`
            - **压缩包**: 下载 `ShenTongAI-Setup-*-x64.exe.zip`

            ### 自动更新
            已安装的用户可通过 electron-updater 自动升级到此版本。

            ### 校验
            SHA-512 哈希请查看 `latest.yml`。
          files: artifacts/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
