appId: com.shentong.ai
productName: 深瞳AI-智能中台
copyright: Copyright © 2026 Shentong
directories:
  output: dist/installer-v${version}
  buildResources: build
files:
  - dist/main/**/*
  - dist/preload/**/*
  - dist/renderer/**/*
  - package.json
  - runtime/manifest.json
  - "!**/*.{ts,tsx,map}"
  - "!src/**"
  - "!electron/**"
  - "!*.config.*"
  # 安全网：防止 npm electron 包被误打包进 asar
  - "!node_modules/electron{,/**/*}"
  # H-08b fix: 包含 sqlcipher stub 模块，使运行时 require('@journeyapps/sqlcipher') 不崩溃
  - node_modules/@journeyapps/sqlcipher/package.json
  - node_modules/@journeyapps/sqlcipher/lib/sqlite3.js
  - node_modules/@journeyapps/sqlcipher/lib/sqlite3.d.ts
asar: true
# H-08b workaround: @journeyapps/sqlcipher 6.0.0 移除了 Windows os 支持（os: ["darwin", "linux"]），
# 没有 prebuilt binary，源码编译需要 Visual Studio Build Tools。
# 此处复用 5.3.1 时代的 N-API v6 Windows prebuilt binary（ABI 稳定，与 Electron 41 N-API v9 兼容），
# 已手动放置于 node_modules/@journeyapps/sqlcipher/build/Release/node_sqlite3.node。
# 禁用 npmRebuild 防止 electron-builder 调用 @electron/rebuild 覆盖该 binary。
# 详细说明见 fix-technical-doc.md Task 15 SubTask 15.5/15.6 与 README.md。
npmRebuild: false
nodeGypRebuild: false
extraResources:
  # 逐文件复制到 resources/ 顶层（目录复制会产生 resources/resources/ 嵌套）
  - from: resources/icon.png
    to: icon.png
  - from: runtime/manifest.json
    to: runtime/manifest.json
  # 内置嵌入式 Python（CI「🐍 Download Hermes Python Runtime」在打包前生成）。
  # 缺失后果：设置里的「环境组件」全部显示未安装且无法安装，业务流引擎/微信域桥/抖音服务
  # 会回退宿主机 python 命令（用户机通常没有）而启动失败。2026-09-13 修复的历史遗漏。
  - from: runtime/hermes/python
    to: runtime/hermes/python
  # 服务行清单（base + modules/*）；dev 从 desktop/resources/service-registry 读取
  - from: resources/service-registry/base.patch.yaml
    to: service-registry/base.patch.yaml
  - from: resources/service-registry/modules
    to: service-registry/modules
  # n8n 界面汉化脚本（n8n-trans 用户脚本，注入内嵌 n8n iframe 实现中文界面）
  - from: resources/n8n/n8n-chinese.js
    to: n8n/n8n-chinese.js
  # 内置 Hermes 技能目录（st-claw-controller 等，随包分发；Hermes 启动时同步到 HERMES_HOME/skills）
  - from: resources/hermes/skills
    to: hermes/skills
  # edict blueprints (official SOUL / kanban state machine / agents / scripts): missing breaks all Hermes features
  - from: resources/edict
    to: edict
  # 沙箱受限令牌 launcher（C# SandboxRunner.cs 编译产物；模块严格权限档使用，缺省全权限不触发）
  - from: resources/sandbox/shentong-sandbox-runner.exe
    to: sandbox/shentong-sandbox-runner.exe
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  # 默认 signAndEditExecutable=true：rcedit 会把 build/icon.ico 写入 exe（桌面快捷方式/任务栏图标），无证书时只改图标不签名
  artifactName: ShenTongAI-Setup-${version}-${arch}.${ext}
  # 代码签名（安全审计 S-02）：证书由 CI 经 CSC_LINK（.pfx 路径或 base64）+ CSC_KEY_PASSWORD 注入，
  # electron-builder 会自动读取这两个环境变量 —— 这里刻意不写 ${env.X}：未配置的环境变量会让配置解析失败，
  # 而「是否必须已签名」交给门禁脚本强制：npm run check:release-signing（已挂进 build:win / build:mac），
  # 缺证书直接构建失败；仅本地调试可设 ST_ALLOW_UNSIGNED_RELEASE=1 绕过（会打 warn）。
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 深瞳AI-智能中台
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  include: build/installer.nsh
  # NSIS 安装包单独命名
  artifactName: ShenTongAI-Setup-${version}-${arch}.${ext}
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  icon: build/icon.icns
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # 代码签名 + 公证（安全审计 S-02）：凭据全部走环境变量，不写进仓库。
  # Developer ID 签名：CSC_LINK + CSC_KEY_PASSWORD（或钥匙串身份 CSC_NAME，后者无需密码）；
  # electron-builder 26 检测到 APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID 时自动公证，
  # 因此这里同样不写 ${env.X}（未配置会解析失败）；缺凭据由 check:release-signing 门禁拦下。
dmg:
  # 待证书到位后可置 true（对 dmg 本身签名）；当前依赖 Developer ID 签名 + 公证，未启用 dmg 签名
  sign: false
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
publish:
  provider: generic
  url: https://zt.shentongapi.cn/desktop/
  channel: latest

