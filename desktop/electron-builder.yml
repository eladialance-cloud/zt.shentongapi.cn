appId: com.shentong.ai
productName: 深瞳AI-智能中台
copyright: Copyright © 2026 Shentong
directories:
  output: dist/installer-v${version}
  buildResources: build
files:
  - dist/main/**/*
  - dist/preload/**/*
  - dist/renderer/**/*
  - package.json
  - runtime/manifest.json
  - "!**/*.{ts,tsx,map}"
  - "!src/**"
  - "!electron/**"
  - "!*.config.*"
  # 安全网：防止 npm electron 包被误打包进 asar
  - "!node_modules/electron{,/**/*}"
  # H-08b fix: 包含 sqlcipher stub 模块，使运行时 require('@journeyapps/sqlcipher') 不崩溃
  - node_modules/@journeyapps/sqlcipher/package.json
  - node_modules/@journeyapps/sqlcipher/lib/sqlite3.js
  - node_modules/@journeyapps/sqlcipher/lib/sqlite3.d.ts
asar: true
# H-08b workaround: @journeyapps/sqlcipher 6.0.0 移除了 Windows os 支持（os: ["darwin", "linux"]），
# 没有 prebuilt binary，源码编译需要 Visual Studio Build Tools。
# 此处复用 5.3.1 时代的 N-API v6 Windows prebuilt binary（ABI 稳定，与 Electron 41 N-API v9 兼容），
# 已手动放置于 node_modules/@journeyapps/sqlcipher/build/Release/node_sqlite3.node。
# 禁用 npmRebuild 防止 electron-builder 调用 @electron/rebuild 覆盖该 binary。
# 详细说明见 fix-technical-doc.md Task 15 SubTask 15.5/15.6 与 README.md。
npmRebuild: false
nodeGypRebuild: false
extraResources:
  # 逐文件复制到 resources/ 顶层（目录复制会产生 resources/resources/ 嵌套）
  - from: resources/icon.png
    to: icon.png
  - from: resources/mcp/mcp-gateway-server.js
    to: mcp/mcp-gateway-server.js
  - from: runtime/manifest.json
    to: runtime/manifest.json
  # 内置 Hermes 技能目录（st-claw-controller 等，随包分发；Hermes 启动时同步到 HERMES_HOME/skills）
  - from: resources/hermes/skills
    to: hermes/skills
  # 内置 OpenClaw 技能目录（缺失会导致 openclaw.json extraDirs 指向失效路径、OpenClaw 启动校验失败）
  - from: resources/openclaw/skills
    to: openclaw/skills
  # edict blueprints (official SOUL / kanban state machine / agents / scripts): missing breaks all Hermes features
  - from: resources/edict
    to: edict
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  # 默认 signAndEditExecutable=true：rcedit 会把 build/icon.ico 写入 exe（桌面快捷方式/任务栏图标），无证书时只改图标不签名
  artifactName: ShenTongAI-Setup-${version}-${arch}.${ext}
  # 代码签名：通过环境变量配置，不硬编码证书路径/密码
  # 构建时设置 CSC_LINK（证书文件路径或 base64）与 CSC_KEY_PASSWORD 环境变量即可启用签名
  # certificateFile: ${env.CSC_LINK}
  # certificatePassword: ${env.CSC_KEY_PASSWORD}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 深瞳AI-智能中台
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  include: build/installer.nsh
  # NSIS 安装包单独命名
  artifactName: ShenTongAI-Setup-${version}-${arch}.${ext}
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  icon: build/icon.icns
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # 代码签名 + 公证：通过环境变量配置，不硬编码证书/凭据
  # Developer ID 签名：设置 CSC_LINK / CSC_KEY_PASSWORD（或 CSC_NAME 使用钥匙串身份）
  # identity: ${env.CSC_NAME}
  # 公证（Notarization）：设置 APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID
  # notarize:
  #   teamId: ${env.APPLE_TEAM_ID}
dmg:
  sign: false
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
publish:
  provider: generic
  url: https://zt.shentongapi.cn/desktop/
  channel: latest

